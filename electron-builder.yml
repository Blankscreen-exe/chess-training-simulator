appId: io.github.blankscreen-exe.chess-training-simulator
productName: Chess Training Simulator
copyright: Copyright © 2026 Blankscreen-exe

directories:
  output: release
  buildResources: build

# Only the built app, its package file and the licences go into the package.
files:
  - out/**/*
  - '!out/THIRD_PARTY_LICENSES.txt'
  - package.json
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # Generated by scripts/collect-licenses.mjs from what the build bundled.
  - from: out/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt
# Only the one Stockfish build the app uses (about 2 MB), not the whole package (about 200 MB).
# It sits outside the app's archive, where the engine's process can load it.
extraResources:
  - from: node_modules/stockfish/bin
    to: engine
    filter:
      - stockfish-19-lite-single.js
      - stockfish-19-lite-single.wasm
  - from: node_modules/stockfish/Copying.txt
    to: engine/Copying.txt

asar: true

# Installers are named alike on every platform: chess-training-simulator-0.1.0-win-x64.exe.
artifactName: ${name}-${version}-${os}-${arch}.${ext}
# Never published from here: the release workflow drafts a GitHub release with what it built.
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: LICENSE

mac:
  category: public.app-category.games
  target:
    # One for Apple silicon and one for Intel, each half the size of a universal build.
    - target: dmg
      arch: [arm64, x64]

linux:
  category: Game
  synopsis: A chess trainer where Claude coaches you
  # The .deb needs a maintainer; without one it would ask the author's email.
  maintainer: Blankscreen-exe
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

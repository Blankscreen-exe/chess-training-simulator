name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs these same checks before it builds its installers.
  workflow_call:
    inputs:
      checks-only:
        description: Skip the unpacked builds, as the caller builds installers itself
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build (${{ matrix.os }})
    needs: check
    if: ${{ !inputs.checks-only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # An unpacked app, without installers or signing: enough to show it packages on each platform.
      - run: pnpm package:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
